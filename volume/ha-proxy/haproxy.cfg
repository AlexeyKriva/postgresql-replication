global

    maxconn 100
    log stdout format raw local0


defaults

    log global

    mode tcp

    option tcplog

    retries 3

    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout check 7s

    log-format "%ci:%cp [%tr] %ft -> %b/%s bytes=%B duration=%Tq/%Tw/%Tc/%Tt"


listen postgresql-primary

    bind *:5000

    option tcplog
    option log-health-checks

    option httpchk GET /primary
    http-check expect status 200

    default-server fall 3 rise 4 inter 5s fastinter 3s on-marked-down shutdown-sessions

    server postgresql-server-1 patroni-1:5432 check port 8008
    server postgresql-server-2 patroni-2:5432 check port 8008
    server postgresql-server-3 patroni-3:5432 check port 8008


listen postgresql-replicas

    bind *:5001

    option tcplog
    option log-health-checks

    option httpchk GET /replica
    http-check expect status 200

    balance roundrobin

    default-server fall 3 rise 4 inter 5s fastinter 3s on-marked-down shutdown-sessions

    server postgresql-server-1 patroni-1:5432 check port 8008
    server postgresql-server-2 patroni-2:5432 check port 8008
    server postgresql-server-3 patroni-3:5432 check port 8008
